# Execute the course demos end-to-end to catch breakage from upstream changes.
#
# Runs --nbval-lax: every cell is executed and only UNEXPECTED exceptions fail
# the run. Output is not compared, so plots and version strings do not cause
# false failures.
#
# Skipped on purpose:
#   - legacy_files/: archived modules, not maintained.
#   - course_demos/Bwaise_Sanitation/MCDA.ipynb: an exercise that reads an Excel
#     file (MCDA_Solution.xlsm) students create themselves; it is not in the repo.
#
# Triggers: weekly (catches upstream drift with no commit here), on demand, and
# on pushes/PRs that touch notebooks or the environment.

name: test-notebook

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
  push:
    paths:
      - 'course_demos/**'
      - 'supplementary_materials/**'
      - 'requirements.txt'
      - '.github/workflows/test-notebook.yml'
  pull_request:
    paths:
      - 'course_demos/**'
      - 'supplementary_materials/**'
      - 'requirements.txt'
      - '.github/workflows/test-notebook.yml'

jobs:
  test-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
        cache-dependency-path: requirements.txt
    - name: Install graphviz
      # QSDsan's .diagram() shells out to graphviz `dot`.
      run: sudo apt-get update && sudo apt-get install -y graphviz
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nbval
    - name: Run notebooks
      env:
        MPLBACKEND: Agg
      run: |
        # Each notebook runs from its own folder, since some read files next to them.
        # Keep going after a failure so one broken notebook doesn't hide the others.
        status=0
        while IFS= read -r nb; do
          echo "::group::$nb"
          (cd "$(dirname "$nb")" && pytest --nbval-lax --current-env --nbval-cell-timeout=300 \
            -o addopts="" -p no:cacheprovider "$(basename "$nb")") || status=1
          echo "::endgroup::"
        done < <(find course_demos supplementary_materials -name '*.ipynb' \
                   -not -path '*checkpoints*' -not -name 'MCDA.ipynb' | sort)
        exit $status
